name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # 22.04 ships tmux 3.2a (the documented minimum), 24.04 ships tmux 3.4.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      TERM: xterm-256color
    steps:
      - uses: actions/checkout@v4
      - name: Install tmux and shellcheck
        run: sudo apt-get update && sudo apt-get install -y tmux shellcheck
      - run: tmux -V
      - name: Audit (README claims)
        run: bash tests/audit.sh
      - name: Tests
        run: bash tests/run.sh
